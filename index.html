<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Pemesanan Barang</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      color: #222;
    }

    .wrap {
      max-width: 820px;
      margin: 24px auto;
      background: #fff;
      padding: 20px;
      border: 1px solid #d9d9d9;
      box-sizing: border-box;
    }

    nav {
      display: flex;
      gap: 12px;
      border: 1px solid #000;
      padding: 12px 16px;
      margin-bottom: 18px;
      background: #fafafa;
    }

    nav a {
      color: #000;
      text-decoration: none;
      font-weight: bold;
    }

    .layout {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    .kotak-foto {
      width: 180px;
      height: 180px;
      border: 1px solid #888;
      background: linear-gradient(135deg, #e5e5e5, #cfcfcf);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 14px;
      text-align: center;
      padding: 10px;
      box-sizing: border-box;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    td {
      padding: 6px 8px;
      vertical-align: top;
    }

    td.label {
      text-align: right;
      white-space: nowrap;
      font-weight: bold;
      width: 160px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #bdbdbd;
      font-size: 14px;
    }

    .opsi {
      display: block;
      color: #2a2a2a;
      margin-bottom: 6px;
    }

    .btn-hijau {
      background: #1fa31f;
      border: none;
      color: #fff;
      padding: 10px 18px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
    }

    hr {
      margin-top: 24px;
      border: 0;
      border-top: 1px solid #d0d0d0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a href="#">Home</a>
      <a href="#">Result</a>
      <a href="#">Payment</a>
    </nav>

    <form action="#" method="post" id="orderForm">
      <div class="layout">
        <div class="kotak-foto" role="img" aria-label="Foto produk">Product Image</div>

        <table>
          <tr>
            <td class="label">Title</td>
            <td>Keyboard Rp:250000</td>
          </tr>
          <tr>
            <td class="label">Description</td>
            <td style="white-space: normal;">Mechanical keyboard dengan switch blue dan desain premium.</td>
          </tr>
          <tr>
            <td class="label">Model</td>
            <td>KBD-01</td>
          </tr>
          <tr>
            <td class="label">Condition</td>
            <td>Mint</td>
          </tr>
          <tr>
            <td class="label">Total Amount</td>
            <td>Rp 500.000</td>
          </tr>
          <tr>
            <td class="label">Pay to</td>
            <td>Bank Mandiri</td>
          </tr>
          <tr>
            <td class="label"><label for="payment">Payment Method</label></td>
            <td>
              <select id="payment" name="payment">
                <option selected>Visa Debit</option>
                <option>Bank Transfer</option>
                <option>E-Wallet</option>
              </select>
            </td>
          </tr>
          <tr>
            <td class="label"><label for="account_number">Account Number</label></td>
            <td><input type="text" id="account_number" name="account_number" value="11223344" /></td>
          </tr>
          <tr>
            <td class="label"><label for="holder">Account Holder</label></td>
            <td><input type="text" id="holder" name="holder" value="Andi" /></td>
          </tr>
          <tr>
            <td class="label"><label for="phone">Phone Number</label></td>
            <td><input type="text" id="phone" name="phone" value="081212345678" /></td>
          </tr>
          <tr>
            <td class="label"><label for="email">Email</label></td>
            <td><input type="text" id="email" name="email" value="andi@mail.com" /></td>
          </tr>
          <tr>
            <td></td>
            <td>
              <label class="opsi"><input type="radio" name="send_method" value="delivery" checked> Delivery</label>
              <label class="opsi"><input type="radio" name="send_method" value="pickup"> Pickup</label>
            </td>
          </tr>
          <tr>
            <td></td>
            <td><br><button type="submit" class="btn-hijau">Submit</button></td>
          </tr>
        </table>
      </div>
    </form>

    <hr>
  </div>

</body>
</html>
