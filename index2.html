<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pemesanan Pizza</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 20px; color: #222;">
  <main style="max-width: 700px; margin: 0 auto;">
    <header style="margin-bottom: 20px;">
      <h1>Form Pemesanan Pizza</h1>
      <p>Isi formulir berikut untuk memesan pizza favoritmu.</p>
    </header>

    <form action="#" method="post" style="max-width: 100%;">
      <fieldset style="margin-bottom: 18px; padding: 14px;">
        <legend>Informasi Pemesan</legend>
        <div style="margin-bottom: 12px;">
          <label for="nama" style="display: block; margin-bottom: 5px;">Nama lengkap</label>
          <input type="text" id="nama" name="nama" autocomplete="name" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 12px;">
          <label for="telepon" style="display: block; margin-bottom: 5px;">Nomor telepon</label>
          <input type="tel" id="telepon" name="telepon" autocomplete="tel" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 12px;">
          <label for="email" style="display: block; margin-bottom: 5px;">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>
        <div>
          <label for="alamat" style="display: block; margin-bottom: 5px;">Alamat pengiriman</label>
          <textarea id="alamat" name="alamat" autocomplete="street-address" required rows="3" style="width: 100%; padding: 8px; box-sizing: border-box;"></textarea>
        </div>
      </fieldset>

      <fieldset style="margin-bottom: 18px; padding: 14px;">
        <legend>Detail Pesanan</legend>
        <div style="margin-bottom: 12px;">
          <label for="jenis-pizza" style="display: block; margin-bottom: 5px;">Pilih pizza</label>
          <select id="jenis-pizza" name="jenis_pizza" required style="width: 100%; padding: 8px;">
            <option value="" selected disabled>-- Pilih menu pizza --</option>
            <option value="margherita">Margherita</option>
            <option value="pepperoni">Pepperoni</option>
            <option value="meat-lovers">Meat Lovers</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="cheese-lovers">Cheese Lovers</option>
          </select>
        </div>
        <div style="margin-bottom: 12px;">
          <strong>Ukuran</strong><br>
          <label><input type="radio" name="ukuran" value="small" required> Small</label>
          <label><input type="radio" name="ukuran" value="medium"> Medium</label>
          <label><input type="radio" name="ukuran" value="large"> Large</label>
        </div>
        <div style="margin-bottom: 12px;">
          <strong>Topping tambahan</strong><br>
          <label><input type="checkbox" name="topping[]" value="extra-cheese"> Extra cheese</label>
          <label><input type="checkbox" name="topping[]" value="mushroom"> Jamur</label>
          <label><input type="checkbox" name="topping[]" value="sausage"> Sosis</label>
          <label><input type="checkbox" name="topping[]" value="olive"> Zaitun</label>
        </div>
        <div style="margin-bottom: 12px;">
          <label for="jumlah" style="display: block; margin-bottom: 5px;">Jumlah pizza</label>
          <input type="number" id="jumlah" name="jumlah" min="1" value="1" required style="width: 100px; padding: 8px;">
        </div>
        <div>
          <label for="catatan" style="display: block; margin-bottom: 5px;">Catatan pesanan</label>
          <textarea id="catatan" name="catatan" rows="3" placeholder="Contoh: jangan terlalu pedas" style="width: 100%; padding: 8px; box-sizing: border-box;"></textarea>
        </div>
      </fieldset>

      <fieldset style="margin-bottom: 18px; padding: 14px;">
        <legend>Pembayaran dan Pengiriman</legend>
        <div style="margin-bottom: 12px;">
          <label for="pembayaran" style="display: block; margin-bottom: 5px;">Metode pembayaran</label>
          <select id="pembayaran" name="pembayaran" required style="width: 100%; padding: 8px;">
            <option value="" selected disabled>-- Pilih metode pembayaran --</option>
            <option value="tunai">Tunai saat diterima</option>
            <option value="transfer">Transfer bank</option>
            <option value="ewallet">E-wallet</option>
          </select>
        </div>
        <div>
          <strong>Metode pengiriman</strong><br>
          <label><input type="radio" name="pengiriman" value="diantar" required> Diantar ke alamat</label>
          <label><input type="radio" name="pengiriman" value="ambil"> Ambil sendiri</label>
        </div>
      </fieldset>

      <div style="text-align: right;">
        <button type="submit" style="padding: 9px 16px;">Kirim Pesanan</button>
      </div>
    </form>
  </main>
</body>
</html>
