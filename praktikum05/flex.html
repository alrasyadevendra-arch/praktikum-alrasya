<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praktikum 5 - Galeri Burung</title>
  <link rel="stylesheet" href="css/praktikum5.css">
</head>
<body class="gallery-page">
  <header class="gallery-heading">
    <h1>Galeri Burung</h1>
    <p>Empat gambar burung disusun menggunakan FlexBox.</p>
  </header>
  <main class="bird-gallery">
    <figure>
      <img src="../images/burung1.png" alt="Perkutut bertengger di dahan">
      <figcaption>Burung 1</figcaption>
    </figure>
    <figure>
      <img src="../images/burung2.png" alt="Perkutut dengan latar alam">
      <figcaption>Burung 2</figcaption>
    </figure>
    <figure>
      <img src="../images/burung3.png" alt="Perkutut dalam sangkar">
      <figcaption>Burung 3</figcaption>
    </figure>
    <figure>
      <img src="../images/burung4.png" alt="Perkutut di bawah cahaya">
      <figcaption>Burung 4</figcaption>
    </figure>
  </main>
  <footer class="gallery-footer">Latihan CSS FlexBox</footer>
</body>
</html>
