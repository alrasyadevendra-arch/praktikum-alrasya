<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout FlexBox - Tiga Gambar</title>
  <link rel="stylesheet" href="css/praktikum5.css">
</head>
<body class="pink-layout">
  <header><strong>Website Praktikum</strong><nav><a href="#">Home</a><a href="#">Galeri</a><a href="#">Kontak</a></nav></header>
  <main>
    <aside><h2>Aside</h2><p>Bagian menu atau keterangan.</p></aside>
    <article>
      <div class="product-intro"><span>Article</span><span>Tiga gambar berjajar</span></div>
      <div class="pink-images">
        <figure><img src="../images/burung4.png" alt="Burung pertama"><figcaption>Gambar 1</figcaption></figure>
        <figure><img src="../images/burung5.png" alt="Burung kedua"><figcaption>Gambar 2</figcaption></figure>
        <figure><img src="../images/burung6.png" alt="Burung ketiga"><figcaption>Gambar 3</figcaption></figure>
      </div>
    </article>
  </main>
  <footer><span>Footer</span><span>Latihan FlexBox</span></footer>
</body>
</html>
