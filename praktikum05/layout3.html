<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout FlexBox - Galeri</title>
  <link rel="stylesheet" href="css/praktikum5.css">
</head>
<body class="photo-layout-page">
  <header class="photo-heading">
    <a href="index.html">Galeri Foto</a>
    <div><h1>Galeri Foto Praktikum</h1><p>Baris pertama berisi tiga foto dan baris kedua lima foto.</p></div>
    <p class="photo-intro">Gambar disusun menggunakan FlexBox.</p>
  </header>
  <main class="photo-layout">
    <div class="photo-row photo-row-one">
      <figure><img src="../images/burung1.png" alt="Burung perkutut pertama"><figcaption>Foto 1</figcaption></figure>
      <figure><img src="../images/burung2.png" alt="Burung perkutut kedua"><figcaption>Foto 2</figcaption></figure>
      <figure><img src="../images/burung3.png" alt="Burung perkutut ketiga"><figcaption>Foto 3</figcaption></figure>
    </div>
    <div class="photo-row photo-row-two">
      <figure><img src="../images/burung4.png" alt="Burung perkutut keempat"><figcaption>Foto 4</figcaption></figure>
      <figure><img src="../images/burung5.png" alt="Burung perkutut kelima"><figcaption>Foto 5</figcaption></figure>
      <figure><img src="../images/burung6.png" alt="Burung perkutut keenam"><figcaption>Foto 6</figcaption></figure>
      <figure><img src="../images/alpukat.jpg" alt="Buah alpukat"><figcaption>Foto 7</figcaption></figure>
      <figure><img src="../assets/aca.jpeg" alt="Foto profil"><figcaption>Foto 8</figcaption></figure>
    </div>
  </main>
  <footer class="photo-footer"><span>Galeri Foto</span><span>Latihan FlexBox</span></footer>
</body>
</html>
